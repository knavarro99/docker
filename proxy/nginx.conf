events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    upstream frontend_upstream {
        server frontend:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
