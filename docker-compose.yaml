services:

  # ---------------------------------------------------------------
  # Base de datos (MySQL) - debe crearse primero
  # ---------------------------------------------------------------
  database:
    image: mysql:8.0
    container_name: taller_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tallerdb
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    networks:
      - red_docker
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Backend (Spring Boot APIREST) - depende de la base de datos
  # ---------------------------------------------------------------
  backend:
    build: ./backend
    container_name: taller_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: tallerdb
      DB_USER: root
      DB_PASSWORD: root_password
      SERVER_PORT: 9092
    ports:
      - "9092:9092"
    networks:
      - red_docker
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9092/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Frontend - 3 replicas, healthcheck cada 5 minutos con timeout 3s
  # depende de que el backend ya exista
  # ---------------------------------------------------------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - red_docker
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80"]
      interval: 5m
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------
  # Proxy / balanceador - unico punto de entrada http://localhost:9091
  # Reparte el trafico entre las 3 replicas del frontend
  # ---------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: taller_proxy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "9091:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - red_docker

networks:
  red_docker:
    driver: bridge

volumes:
  db_data:
